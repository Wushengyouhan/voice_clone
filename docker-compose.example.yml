# 示例：复制为 docker-compose.yml 后改环境变量，不要把填好密钥的文件提交 Git
#   cp docker-compose.example.yml docker-compose.yml
# 首次拉私有镜像：docker login crpi-wzkmn99umn8syi28.cn-shanghai.personal.cr.aliyuncs.com

services:
  voice-clone:
    image: crpi-wzkmn99umn8syi28.cn-shanghai.personal.cr.aliyuncs.com/wushengyouhan/voice_clone:latest
    container_name: voice-clone
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: "mysql://用户:密码@数据库主机:3306/voice_clone"
      ALIYUN_DASHSCOPE_API_KEY: "sk-你的百炼-API-Key"
      COSYVOICE_TARGET_MODEL: "cosyvoice-v2"
      OSS_REGION: "oss-cn-wuhan-lr"
      OSS_ACCESS_KEY_ID: "你的-OSS-AccessKeyId"
      OSS_ACCESS_KEY_SECRET: "你的-OSS-AccessKeySecret"
      OSS_BUCKET: "wushengyouhan-voice"
      OSS_ENDPOINT: "https://oss-cn-wuhan-lr.aliyuncs.com"
      # 可选：CDN 或自定义域名前缀（不填则用 bucket.region.aliyuncs.com）
      # OSS_PUBLIC_BASE_URL: "https://your-cdn.example.com"
      # 可选：样本/合成对象 ACL，与本地 .env 一致即可
      # OSS_OBJECT_ACL: "public-read"
    # 若 MySQL 在本机 127.0.0.1，可解开下行，并把 DATABASE_URL 主机改为 host.docker.internal
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
